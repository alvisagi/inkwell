[package]
name = "typst_core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
typst = "0.15.1"
typst-layout = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "datetime", "system-packages"] }
typst-render = "0.15.1"
uniffi = { version = "0.32.2", features = ["cli"] }
typst-ide = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
ureq = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ttf-parser = "0.25"
codex = "0.3.0"
tract-onnx = "0.23.9"
tiny-skia = "0.12.0"

[profile.release]
lto = "thin"
codegen-units = 4
